mixin {
    if (file("src/main/resources/usermixins.immersive_stamina.json").exists()) {
        config 'usermixins.immersive_stamina.json'
    }
}

jar {
    var mixins = new ArrayList<String>()
    if (file("src/main/resources/immersive_stamina.mixins.json").exists()) {
        mixins.add("immersive_stamina.mixins.json")
    }
    if (file("src/main/resources/usermixins.immersive_stamina.json").exists()) {
        mixins.add("usermixins.immersive_stamina.json")
    }
    manifest.attributes([
            "MixinConfigs": String.join(",",mixins)
    ])
}